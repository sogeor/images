site_name: sogeor images
site_description: Hardened VM images for the sogeor platform
repo_url: https://github.com/sogeor/images
repo_name: sogeor/images
edit_uri: edit/master/docs/
copyright: Copyright &copy; sogeor. Licensed under Apache-2.0.
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Repository setup: setup.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Operations: operations.md
  - Architecture: architecture.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Workflows: reference/workflows.md
      - Scripts and tools: reference/scripts.md
      - Names and tags: reference/tags.md
  - Decisions:
      - Overview: adr/index.md
      - "0001 Record architecture decisions": adr/0001-record-architecture-decisions.md
      - "0002 Local build workflow": adr/0002-local-build-workflow.md
      - "0003 CI access over WireGuard": adr/0003-ci-access-over-wireguard.md
      - "0004 Talos Image Factory": adr/0004-talos-image-factory.md
