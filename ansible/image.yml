---
- name: Image hardening
  hosts: all
  become: true
  gather_facts: true
  vars:
    hardening_profile: image
  tasks:
    - name: Ensure supported profile
      ansible.builtin.assert:
        that: hardening_profile == "image"
        fail_msg: "image.yml supports only the image profile"

    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
          ClientAliveInterval 300
          ClientAliveCountMax 2
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Apply kernel hardening sysctl
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/80-hardening.conf
        state: present
        reload: true
      loop: "{{ sysctl_hardening | dict2items }}"
      vars:
        sysctl_hardening:
          kernel.kptr_restrict: "2"
          kernel.dmesg_restrict: "1"
          kernel.yama.ptrace_scope: "1"
          fs.protected_hardlinks: "1"
          fs.protected_symlinks: "1"
          fs.suid_dumpable: "0"
          net.ipv4.conf.all.accept_redirects: "0"
          net.ipv4.conf.default.accept_redirects: "0"
          net.ipv4.conf.all.send_redirects: "0"
          net.ipv4.conf.all.accept_source_route: "0"
          net.ipv4.conf.all.log_martians: "1"
          net.ipv4.tcp_syncookies: "1"
          net.ipv6.conf.all.accept_redirects: "0"

    - name: Disable core dumps
      ansible.builtin.copy:
        dest: /etc/security/limits.d/10-no-core.conf
        owner: root
        group: root
        mode: "0644"
        content: "* hard core 0\n"

    - name: Install base audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/10-image.rules
        owner: root
        group: root
        mode: "0640"
        content: |
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/sudoers -p wa -k scope
          -w /etc/sudoers.d/ -p wa -k scope
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd
      notify: Reload audit rules

    - name: Enable unattended security upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        install_recommends: false

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Reload audit rules
      ansible.builtin.command: augenrules --load
      changed_when: true
