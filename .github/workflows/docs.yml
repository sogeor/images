name: docs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: sogeor/workflows/.github/workflows/docs.yml@f3d239075a515eb750183009ac483e37043dd6da # v1.0.0
    with:
      link-args: >-
        --exclude-path .build
        --exclude '^https://github\.com/sogeor/images/(security|issues/new)'
        --exclude '^https://factory\.talos\.dev/?$'
