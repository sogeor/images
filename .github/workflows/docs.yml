name: docs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: sogeor/workflows/.github/workflows/docs.yml@9bf70c2efed3619055210da0d0f70d9741850fcc # v1.1.2
    with:
      link-args: >-
        --exclude-path .build
        --exclude '^https://github\.com/sogeor/images/(security|issues/new)'
        --exclude '^https://factory\.talos\.dev/?$'
