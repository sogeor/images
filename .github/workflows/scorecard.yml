name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]

permissions: {}

jobs:
  scorecard:
    name: scorecard
    uses: sogeor/workflows/.github/workflows/scorecard.yml@f3d239075a515eb750183009ac483e37043dd6da # v1.0.0
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      scorecard-token: ${{ secrets.SCORECARD_TOKEN }}
