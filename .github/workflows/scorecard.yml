name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]

permissions: {}

jobs:
  scorecard:
    name: scorecard
    uses: sogeor/workflows/.github/workflows/scorecard.yml@9bf70c2efed3619055210da0d0f70d9741850fcc # v1.1.2
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      scorecard-token: ${{ secrets.SCORECARD_TOKEN }}
