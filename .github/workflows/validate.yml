name: validate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_VERSION: "1.16.1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  packer:
    name: packer fmt / validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: packer fmt
        run: tools/packer.sh fmt

      - name: packer init + validate -syntax-only
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          for image in images/*/; do
            image="$(basename "$image")"
            echo "::group::${image}"
            tools/packer.sh init "$image"
            tools/packer.sh validate "$image" --syntax-only
            echo "::endgroup::"
          done

  lint:
    name: linters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --user --quiet --require-hashes -r .github/requirements-lint.txt
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck -x

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook --syntax-check -i localhost, ansible/image.yml
          ansible-lint ansible/

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor --offline --min-severity low .github/workflows

      - name: gitleaks
        run: gitleaks git --redact --no-banner .
