name: build

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      image:
        type: choice
        options: [all, base, k8s, talos]
        default: all
      base_template:
        type: string
        required: false
      debug:
        type: boolean
        default: false
      prune:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packer-build-proxmox
  cancel-in-progress: false

jobs:
  base:
    name: ubuntu-2404-base
    if: >-
      github.ref == 'refs/heads/master'
      && (github.event_name == 'schedule' || inputs.image == 'all' || inputs.image == 'base')
    uses: sogeor/workflows/.github/workflows/packer-build.yml@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      environment: images
      image: ubuntu-2404-base
      build-command: tools/ci-build.sh
      install-command: tools/ci-install.sh
      ca-pem-var: PROXMOX_CA_PEM
      mesh: wireguard
      manifest-file: manifest/ubuntu-2404-base.json
      manifest-query: .builds[-1].custom_data.template_name
      debug: ${{ inputs.debug || false }}

  k8s:
    name: ubuntu-2404-k8s
    needs: base
    if: >-
      always()
      && github.ref == 'refs/heads/master'
      && (needs.base.result == 'success' || needs.base.result == 'skipped')
      && (github.event_name == 'schedule' || inputs.image == 'all' || inputs.image == 'k8s')
    uses: sogeor/workflows/.github/workflows/packer-build.yml@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      environment: images
      image: ubuntu-2404-k8s
      build-command: tools/ci-build.sh
      install-command: tools/ci-install.sh
      ca-pem-var: PROXMOX_CA_PEM
      mesh: wireguard
      packer-vars: |
        base_template=${{ needs.base.outputs.result || inputs.base_template }}
      manifest-file: manifest/ubuntu-2404-k8s.json
      manifest-query: .builds[-1].custom_data.template_name
      debug: ${{ inputs.debug || false }}

  verify-clone:
    name: verify clone (${{ matrix.image }})
    needs: [base, k8s]
    if: >-
      always()
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'schedule' || inputs.image != 'talos')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    environment: images
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: [base, k8s]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export environment
        uses: sogeor/workflows/actions/export-env@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
        with:
          vars-json: ${{ toJSON(vars) }}
          vars: PROXMOX_URL PROXMOX_USERNAME
          dotenv: ${{ secrets.ENV_SECRETS }}

      - name: Trust Proxmox CA
        env:
          CA_PEM: ${{ vars.PROXMOX_CA_PEM }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CA_PEM" | sudo tee /usr/local/share/ca-certificates/pve-root-ca.crt >/dev/null
          sudo update-ca-certificates >/dev/null

      - name: Connect mesh
        uses: sogeor/workflows/actions/setup-mesh@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
        with:
          mode: wireguard
          wg-private-key: ${{ secrets.WG_RUNNER_PRIVATE_KEY }}
          wg-server-public-key: ${{ vars.WG_SERVER_PUBLIC_KEY }}
          wg-endpoint: ${{ vars.WG_ENDPOINT }}
          wg-address: ${{ vars.WG_ADDRESS }}
          wg-allowed-ips: ${{ vars.WG_ALLOWED_IPS }}
          check-address: ${{ vars.MESH_CHECK_ADDRESS }}

      - name: Install tools
        run: tools/ci-install.sh

      - name: Clone, boot and check
        env:
          IMAGE: ${{ matrix.image }}
          BASE_TEMPLATE: ${{ needs.base.outputs.result }}
          K8S_TEMPLATE: ${{ needs.k8s.outputs.result }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE" == base ]]; then tpl="$BASE_TEMPLATE"; else tpl="$K8S_TEMPLATE"; fi
          if [[ -z "$tpl" ]]; then
            echo "skip: ${IMAGE} not built"
            exit 0
          fi
          tools/verify-clone.sh "$tpl"

  prune:
    name: prune templates
    needs: [base, k8s, verify-clone]
    if: >-
      always()
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'schedule' || (inputs.prune && inputs.image != 'talos'))
      && needs.verify-clone.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    environment: images
    timeout-minutes: 15
    env:
      KEEP: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export environment
        uses: sogeor/workflows/actions/export-env@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
        with:
          vars-json: ${{ toJSON(vars) }}
          vars: PROXMOX_URL PROXMOX_USERNAME
          dotenv: ${{ secrets.ENV_SECRETS }}

      - name: Trust Proxmox CA
        env:
          CA_PEM: ${{ vars.PROXMOX_CA_PEM }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CA_PEM" | sudo tee /usr/local/share/ca-certificates/pve-root-ca.crt >/dev/null
          sudo update-ca-certificates >/dev/null

      - name: Connect mesh
        uses: sogeor/workflows/actions/setup-mesh@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
        with:
          mode: wireguard
          wg-private-key: ${{ secrets.WG_RUNNER_PRIVATE_KEY }}
          wg-server-public-key: ${{ vars.WG_SERVER_PUBLIC_KEY }}
          wg-endpoint: ${{ vars.WG_ENDPOINT }}
          wg-address: ${{ vars.WG_ADDRESS }}
          wg-allowed-ips: ${{ vars.WG_ALLOWED_IPS }}
          check-address: ${{ vars.MESH_CHECK_ADDRESS }}

      - name: Prune
        run: |
          set -euo pipefail
          for kind in k8s base; do
            tools/prune-templates.sh ubuntu-2404 "$kind" "$KEEP" --apply
          done

  talos:
    name: talos-base
    if: >-
      github.ref == 'refs/heads/master'
      && github.event_name == 'workflow_dispatch'
      && inputs.image == 'talos'
    runs-on: ubuntu-24.04
    environment: images
    timeout-minutes: 45
    env:
      KEEP: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export environment
        uses: sogeor/workflows/actions/export-env@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
        with:
          vars-json: ${{ toJSON(vars) }}
          vars: PROXMOX_URL PROXMOX_USERNAME
          dotenv: ${{ secrets.ENV_SECRETS }}

      - name: Trust Proxmox CA
        env:
          CA_PEM: ${{ vars.PROXMOX_CA_PEM }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CA_PEM" | sudo tee /usr/local/share/ca-certificates/pve-root-ca.crt >/dev/null
          sudo update-ca-certificates >/dev/null

      - name: Connect mesh
        uses: sogeor/workflows/actions/setup-mesh@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
        with:
          mode: wireguard
          wg-private-key: ${{ secrets.WG_RUNNER_PRIVATE_KEY }}
          wg-server-public-key: ${{ vars.WG_SERVER_PUBLIC_KEY }}
          wg-endpoint: ${{ vars.WG_ENDPOINT }}
          wg-address: ${{ vars.WG_ADDRESS }}
          wg-allowed-ips: ${{ vars.WG_ALLOWED_IPS }}
          check-address: ${{ vars.MESH_CHECK_ADDRESS }}

      - name: Install talosctl
        run: tools/talos-install-cli.sh

      - id: template
        name: Create template
        env:
          BUILD_VERSION: ${{ github.run_number }}-${{ github.run_attempt }}
        run: tools/talos-template.sh "$BUILD_VERSION"

      - name: Clone, boot and check
        env:
          TEMPLATE: ${{ steps.template.outputs.template }}
        run: tools/verify-talos.sh "$TEMPLATE"

      - name: Prune
        if: inputs.prune
        run: tools/prune-templates.sh talos base "$KEEP" --apply
